name: Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    name: Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify types, lint, builds, and tests
        run: npm test
