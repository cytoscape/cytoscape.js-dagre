name: Mocha Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  mocha:
    name: Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Mocha tests
        run: npm test
